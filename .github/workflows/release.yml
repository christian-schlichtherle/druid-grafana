name: Release

on:
  push:
    tags:
      - 'v*.*.*' # Run workflow on version tags, e.g. v1.0.0.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      # build-plugin installs Go with GOTOOLCHAIN=local, so it cannot fetch a newer toolchain
      # on demand. Pass the version required by go.mod instead of relying on its default.
      - name: Read Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: grafana/plugin-actions/build-plugin@main
        env:
          GRAFADRUID_USE_DOCKER: 0
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
          go-version: ${{ steps.go.outputs.version }}
